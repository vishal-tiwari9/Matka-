[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "shanghai"
gas_reports = ["*"]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
bsc_testnet    = "${BSC_TESTNET_RPC}"
monad_testnet  = "${MONAD_TESTNET_RPC}"

# Monad testnet block explorer (Blockscout-compatible)
# Use --verify --verifier blockscout --verifier-url https://testnet.monadexplorer.com/api
# for contract verification on Monad.
# BSC verification (kept for reference):
[etherscan]
bsc_testnet   = { key = "${ETHERSCAN_API_KEY}", chain = 97 }
